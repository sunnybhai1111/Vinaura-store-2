<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Vinaura | Handcrafted Luxury Couture</title>
  <!-- Myntra style fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #050505;
      --card-bg: #101010;
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #AA771C);
      --text-white: #FFFFFF;
      --text-dim: #909090;
      --border-gold: rgba(212, 175, 55, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Assistant', sans-serif;
      overflow-x: hidden;
      padding-bottom: 70px; /* Space for bottom cart bar */
    }

    /* 1. SCROLLING TICKER (Edit from Admin) */
    .ticker-wrap {
      width: 100%;
      background-color: rgba(212, 175, 55, 0.1);
      border-bottom: 1px solid var(--border-gold);
      color: var(--gold-light);
      font-size: 11px;
      padding: 4px 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      z-index: 1001;
      height: 22px;
      display: flex;
      align-items: center;
    }
    .ticker {
      display: inline-block;
      white-space: nowrap;
      padding-right: 100%;
      animation: ticker 25s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* HEADER */
    header {
      position: fixed;
      top: 22px; /* below ticker */
      width: 100%;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-gold);
      display: flex;
      justify-content: center; /* Centered Logo like premium brands */
      align-items: center;
      padding: 12px 20px;
      height: 55px;
    }
    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      cursor: pointer; /* For secret click */
    }

    main { margin-top: 85px; } /* Space for ticker + header */

    /* 2. PROMO ADS SLIDER (Myntra style, edit from Admin) */
    .promo-slider {
      width: 100%;
      height: 200px; /* Mobile banner height */
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
    }
    .slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }
    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .slider-dots {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      cursor: pointer;
    }
    .dot.active { background: var(--gold-primary); width: 12px; border-radius: 3px; }

    /* CATEGORY QUICK LINKS (Optional, Myntra vibe) */
    .cat-links {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 15px 15px;
      scrollbar-width: none;
    }
    .cat-links::-webkit-scrollbar { display: none; }
    .cat-btn {
      flex: 0 0 auto;
      background: #151515;
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      padding: 6px 15px;
      border-radius: 15px;
      font-size: 12px;
      text-transform: uppercase;
    }

    /* PRODUCT GRID */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 10px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 columns mobile */
      gap: 10px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 4px; /* Sharper Myntra look */
      overflow: hidden;
      transition: transform 0.2s;
    }
    .product-card:active { transform: scale(0.98); }

    /* PRODUCT MEDIA SCROLLER (Inside Card) */
    .p-media-wrap {
      width: 100%;
      height: 220px; /* Fixed height for consistency */
      position: relative;
      background: #000;
    }
    .p-media-scroller {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .p-media-scroller::-webkit-scrollbar { display: none; }
    .p-media-item {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: center;
    }
    .p-media-item img, .p-media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scroller-dots {
      position: absolute;
      bottom: 5px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 3px;
    }
    .s-dot { width: 4px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 50%; }
    .s-dot.active { background: var(--gold-primary); }

    /* PRODUCT INFO */
    .p-info {
      padding: 8px;
    }
    .p-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .p-tagline {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      height: 14px;
      overflow: hidden;
    }
    .p-price-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 8px;
    }
    .p-price { font-size: 14px; font-weight: 700; color: var(--gold-light); }
    .p-old-price { font-size: 11px; color: var(--text-dim); text-decoration: line-through; }

    .btn-wa-sm {
      width: 100%;
      padding: 8px;
      background: var(--gold-gradient);
      border: none;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* BOTTOM CART BAR (Myntra vibe) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #121212;
      border-top: 1px solid var(--border-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      z-index: 999;
      height: 60px;
    }
    .cart-info { display: flex; align-items: center; gap: 10px; }
    .cart-count-icon {
      position: relative;
      font-size: 20px;
    }
    .count-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: var(--gold-primary);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-checkout {
      padding: 10px 20px;
      background: var(--gold-gradient);
      border: none;
      color: #000;
      font-family: 'Assistant', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border-radius: 2px;
      text-transform: uppercase;
    }

    /* MODALS (Cart, Size) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1100;
      justify-content: center;
      align-items: flex-end; /* Mobile bottom sheet style */
    }
    .modal-content {
      background: #101010;
      border-top: 1px solid var(--border-gold);
      border-radius: 12px 12px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 20px;
    }
    .modal-title { font-family: 'Cinzel', serif; color: var(--gold-light); margin-bottom: 15px; font-size: 16px; text-align: center; }

    /* Cart Items */
    .cart-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #202020; align-items: center; }
    .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .cart-item-details { flex: 1; }
    .cart-item-title { font-size: 13px; color: #fff; }
    .cart-item-sub { font-size: 11px; color: var(--gold-primary); }
    .btn-remove { background: none; border: none; color: #ff5252; font-size: 11px; cursor: pointer; }

    /* Size Selector Sheet */
    .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .size-btn {
      background: #181818;
      border: 1px solid #303030;
      color: #fff;
      padding: 12px;
      text-align: center;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .size-btn.selected { border-color: var(--gold-primary); background: rgba(212, 175, 55, 0.1); color: var(--gold-primary); font-weight: 600; }

    /* --- ADMIN PANEL STYLE (No visible button) --- */
    #admin-modal .modal-content {
      align-items: center;
      justify-content: center;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    #admin-pin-container { text-align: center; }
    #admin-main-container { display: none; width: 100%; }
    
    .admin-tab-bar { display: flex; width: 100%; border-bottom: 1px solid var(--border-gold); margin-bottom: 15px; gap: 5px;}
    .admin-tab { flex:1; padding: 10px; text-align: center; color: var(--text-dim); font-size: 12px; cursor: pointer; text-transform: uppercase;}
    .admin-tab.active { color: var(--gold-primary); border-bottom: 2px solid var(--gold-primary); font-weight: 600; }
    
    .admin-section { display: none; }
    .admin-section.active { display: block; width: 100%; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; color: var(--gold-light); margin-bottom: 4px; text-transform: uppercase;}
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      background: #181818;
      border: 1px solid #303030;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      font-family: 'Assistant', sans-serif;
    }
    .form-group input[type="file"] { border: 1px dashed var(--border-gold); padding: 20px; text-align: center;}

    /* Image Previews in Admin */
    .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .preview-box { width: 60px; height: 60px; position: relative; border-radius: 4px; overflow: hidden; border: 1px solid #303030; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .preview-remove { position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.7); color: red; border: none; font-size: 12px; padding: 2px; cursor: pointer; }

    .inv-item { display: flex; gap: 10px; align-items: center; padding: 10px; background: #151515; border-radius: 4px; margin-bottom: 8px;}
    .inv-img { width: 40px; height: 40px; object-fit: cover; border-radius: 2px;}
    .btn-admin { padding: 10px 15px; background: #202020; color: #fff; border: 1px solid #303030; border-radius: 4px; font-size: 12px; cursor: pointer;}
    .btn-admin.save { background: var(--gold-gradient); color: #000; font-weight: 600; border: none;}
    .btn-admin.del { background: #401010; color: #ff5252; border-color: #602020;}
  </style>
</head>
<body>

  <!-- 1. TOP TICKER (Editable) -->
  <div class="ticker-wrap">
    <div class="ticker" id="ticker-text">🌸 LOADING VAURA ELEGANCE...</div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="brand-logo" id="brand-logo">THE VINAURA</div>
  </header>

  <main>
    <!-- CATEGORY LINKS -->
    <div class="cat-links">
      <button class="cat-btn">All</button>
      <button class="cat-btn">Kids</button>
      <button class="cat-btn">Women</button>
      <button class="cat-btn">Newborn</button>
    </div>

    <!-- 2. PROMO ADS SLIDER (Editable Images) -->
    <div class="promo-slider" id="promo-slider">
      <div class="slider-track" id="slider-track">
        <!-- Slides added via JS -->
      </div>
      <div class="slider-dots" id="slider-dots"></div>
    </div>

    <!-- PRODUCT GRID -->
    <div class="container">
      <div class="product-grid" id="product-grid">
        <!-- Products added via JS -->
      </div>
    </div>
  </main>

  <!-- BOTTOM CART BAR -->
  <div class="bottom-bar">
    <div class="cart-info" onclick="openCart()">
      <div class="cart-count-icon">
        👜
        <div class="count-badge" id="cart-count">0</div>
      </div>
      <div style="font-size: 14px; font-weight: 700; color: var(--gold-light);" id="cart-total">₹0</div>
    </div>
    <button class="btn-checkout" onclick="checkoutWhatsApp()">Book on WA</button>
  </div>

  <!-- CART MODAL SHEET -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('cart-modal')">✕</button>
      <div class="modal-title">Your Bag</div>
      <div id="cart-items">
        <!-- Cart Items via JS -->
      </div>
      <div style="margin-top: 20px; text-align: right; border-top: 1px solid #202020; padding-top: 10px;">
        <span style="color: var(--text-dim); font-size: 13px;">Total: </span>
        <span style="color: var(--gold-primary); font-size: 18px; font-weight: 700;" id="cart-modal-total">₹0</span>
      </div>
    </div>
  </div>

  <!-- SIZE SELECTOR SHEET -->
  <div class="modal" id="size-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('size-modal')">✕</button>
      <div class="modal-title">Select Size</div>
      <div class="size-grid" id="size-options">
        <!-- Sizes via JS -->
      </div>
      <button class="btn-checkout" style="width: 100%;" id="add-to-cart-final">Add to Bag 👜</button>
    </div>
  </div>

  <!-- --- SECRET ADMIN PANEL (Log in by clicking Logo 5 times) --- -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('admin-modal')">✕</button>
      <div class="modal-title">Owner Access</div>
      
      <!-- PIN Login -->
      <div id="admin-pin-container">
        <div class="form-group">
          <label>Enter Security PIN</label>
          <input type="password" id="admin-pin" maxlength="4" placeholder="****" style="text-align:center; letter-spacing: 10px; font-size: 20px;">
        </div>
        <button class="btn-admin save" onclick="loginAdmin()" style="width: 100%;">Access Panel</button>
      </div>

      <!-- Main Admin Area (Hidden initially) -->
      <div id="admin-main-container">
        <div class="admin-tab-bar">
          <div class="admin-tab active" onclick="switchAdminTab('website')">Site Info</div>
          <div class="admin-tab" onclick="switchAdminTab('add')">Add Product</div>
          <div class="admin-tab" onclick="switchAdminTab('inv')">Inventory</div>
        </div>

        <!-- Section 1: Site Settings -->
        <div class="admin-section active" id="admin-website">
          <div class="form-group">
            <label>Store WhatsApp Number</label>
            <input type="text" id="admin-wa-number" placeholder="918143714524">
          </div>
          <div class="form-group">
            <label>Top Scroller Text (offers)</label>
            <input type="text" id="admin-ticker-input" placeholder="Special Discount for Dussehra...">
          </div>
          <div class="form-group">
            <label>Promo Banner Images (Select from Gallery)</label>
            <input type="file" id="admin-promo-files" accept="image/*" multiple>
            <div class="preview-container" id="promo-previews"></div>
          </div>
          <button class="btn-admin save" onclick="saveSiteSettings()" style="width: 100%; margin-top: 10px;">Save Site settings</button>
        </div>

        <!-- Section 2: Add/Edit Product -->
        <div class="admin-section" id="admin-add">
          <input type="hidden" id="edit-prod-id">
          <div class="form-group">
            <label>Product Images (Gallery)</label>
            <input type="file" id="admin-prod-files" accept="image/*" multiple>
            <div class="preview-container" id="prod-previews"></div>
          </div>
          <div class="form-group">
            <label>Product Title</label>
            <input type="text" id="admin-prod-title">
          </div>
          <div class="form-group">
            <label>Short Description (Fabric, vibe)</label>
            <input type="text" id="admin-prod-tag">
          </div>
          <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex:1;">
              <label>Price (₹)</label>
              <input type="number" id="admin-prod-price">
            </div>
            <div class="form-group" style="flex:1;">
              <label>Old Price (Optional)</label>
              <input type="number" id="admin-prod-old-price">
            </div>
          </div>
          <div class="form-group">
            <label>Available Sizes (comma separated)</label>
            <input type="text" id="admin-prod-sizes" placeholder="0-6M, 1-2Y, 3-4Y">
          </div>
          <button class="btn-admin save" onclick="saveProduct()" style="width: 100%;" id="btn-save-prod">Publish Product</button>
          <button class="btn-admin" onclick="resetProdForm()" style="width: 100%; margin-top: 5px; display: none;" id="btn-cancel-edit">Cancel Edit</button>
        </div>

        <!-- Section 3: Inventory List -->
        <div class="admin-section" id="admin-inv">
          <div id="admin-inventory-list">
            <!-- Inventory items -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- DATABASE (Using LocalStorage so data persists after refresh) ---
    function dbGet(key, defaultVal) {
      try { return JSON.parse(localStorage.getItem(key)) || defaultVal; }
      catch { return defaultVal; }
    }
    function dbSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    // INITIAL APP DATA
    let siteSettings = dbGet('vinaura_settings', {
      wa: '918143714524',
      ticker: '✨ Special Dussehra Discount: DM for exclusive festive offers! Free shipping on bespoke sets.',
      promoBanners: [] // Store Base64 strings
    });

    let products = dbGet('vinaura_products', []);
    let cart = []; // Cart doesn't persist across refresh for security/freshness
    let currentPromoSlide = 0;
    let logoClickCount = 0;
    let tempProdIdForSize = null;
    let selectedSize = null;

    // Form Image Holder (Binary Base64)
    let formPromoImages = [];
    let formProdImages = [];

    // --- INIT ---
    window.onload = function() {
      applySettings();
      renderPromos();
      renderProducts();
      updateCartUI();
      startPromoAutoSlider();
      
      // Secret Admin Access
      document.getElementById('brand-logo').addEventListener('click', () => {
        logoClickCount++;
        if (logoClickCount === 5) {
          logoClickCount = 0;
          openModal('admin-modal');
        }
        setTimeout(() => logoClickCount = 0, 2000); // Reset count if not clicked fast
      });

      // File Input Listeners
      document.getElementById('admin-promo-files').addEventListener('change', (e) => handleFileSelect(e, formPromoImages, 'promo-previews'));
      document.getElementById('admin-prod-files').addEventListener('change', (e) => handleFileSelect(e, formProdImages, 'prod-previews'));
    };

    // --- CORE FX: Image to Base64 (Gallery Upload) ---
    function handleFileSelect(event, imageArray, previewContainerId) {
      const files = event.target.files;
      const container = document.getElementById(previewContainerId);
      container.innerHTML = ''; // Clear previews
      imageArray.length = 0; // Clear array

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (!file.type.startsWith('image/')) continue;

        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Str = e.target.result;
          imageArray.push(base64Str);
          
          // Add Preview
          const box = document.createElement('div');
          box.className = 'preview-box';
          box.innerHTML = `<img src="${base64Str}"><button class="preview-remove" onclick="removeQueuedImage(this, '${previewContainerId}', ${imageArray.length - 1})">✕</button>`;
          container.appendChild(box);
        };
        reader.readAsDataURL(file);
      }
    }
    
    function removeQueuedImage(btn, containerId, index) {
      // In a real app, this logic is trickier with arrays. Simplified for single file input re-renders.
      const filesInput = containerId === 'promo-previews' ? 'admin-promo-files' : 'admin-prod-files';
      document.getElementById(filesInput).value = ''; // Reset file input
      btn.parentElement.remove();
      if(containerId === 'promo-previews') formPromoImages.splice(index, 1);
      else formProdImages.splice(index, 1);
    }

    // --- UI FX: Apply Settings (Ticker, Promo) ---
    function applySettings() {
      document.getElementById('ticker-text').innerText = siteSettings.ticker;
    }

    // Render Promo Slider
    function renderPromos() {
      const track = document.getElementById('slider-track');
      const dotsContainer = document.getElementById('slider-dots');
      track.innerHTML = '';
      dotsContainer.innerHTML = '';

      if (siteSettings.promoBanners.length === 0) {
        // Default banner if empty
        track.innerHTML = `<div class="slide"><img src="https://via.placeholder.com/600x200?text=The+Vaura+Eleganze"></div>`;
        return;
      }

      siteSettings.promoBanners.forEach((b64, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.innerHTML = `<img src="${b64}">`;
        track.appendChild(slide);

        const dot = document.createElement('span');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => setPromoSlide(index);
        dotsContainer.appendChild(dot);
      });
    }

    function setPromoSlide(index) {
      const track = document.getElementById('slider-track');
      const dots = document.querySelectorAll('#slider-dots .dot');
      currentPromoSlide = index;
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    }

    function startPromoAutoSlider() {
      setInterval(() => {
        if (siteSettings.promoBanners.length < 2) return;
        let nextSlide = (currentPromoSlide + 1) % siteSettings.promoBanners.length;
        setPromoSlide(nextSlide);
      }, 5000);
    }

    // --- UI FX: Products ---
    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = `<p style="text-align: center; grid-column: 1/-1; padding: 40px; color: var(--text-dim); font-size: 13px;">VAURA is crafting elegance. Check back soon.</p>`;
        return;
      }

      products.forEach(p => {
        // Media Scroller HTML
        let mediaItemsHtml = '';
        p.images.forEach(imgB64 => {
          mediaItemsHtml += `<div class="p-media-item"><img src="${imgB64}"></div>`;
        });
        // Dots for scroller
        let scrollerDotsHtml = p.images.map((_, i) => `<span class="s-dot ${i===0?'active':''}"></span>`).join('');

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="p-media-wrap">
            <div class="p-media-scroller" onscroll="handleProductMediaScroll(this)">
              ${mediaItemsHtml}
            </div>
            <div class="scroller-dots">${scrollerDotsHtml}</div>
          </div>
          <div class="p-info">
            <div class="p-title">${p.title}</div>
            <div class="p-tagline">${p.tag}</div>
            <div class="p-price-row">
              <span class="p-price">₹${p.price.toLocaleString()}</span>
              ${p.oldPrice ? `<span class="p-old-price">₹${p.oldPrice.toLocaleString()}</span>` : ''}
            </div>
            <button class="btn-wa-sm" onclick="askForSize('${p.id}')">Add to Bag 👜</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleProductMediaScroll(scroller) {
      const index = Math.round(scroller.scrollLeft / scroller.offsetWidth);
      const dots = scroller.parentElement.querySelectorAll('.s-dot');
      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    }

    // --- CART FX ---
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { 
      document.getElementById(id).style.display = 'none'; 
      if(id === 'admin-modal') logoClickCount = 0; // Reset
    }

    function askForSize(productId) {
      const p = products.find(prod => prod.id === productId);
      if(!p) return;
      tempProdIdForSize = productId;
      selectedSize = null;

      const options = document.getElementById('size-options');
      options.innerHTML = '';
      if(p.sizes && p.sizes.length > 0) {
        p.sizes.forEach(size => {
          const btn = document.createElement('div');
          btn.className = 'size-btn';
          btn.innerText = size;
          btn.onclick = () => {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
          };
          options.appendChild(btn);
        });
        openModal('size-modal');
      } else {
        addToCart(productId, 'Bespoke');
      }
    }

    document.getElementById('add-to-cart-final').onclick = () => {
      if(!selectedSize) { alert("Please select a size"); return; }
      addToCart(tempProdIdForSize, selectedSize);
      closeModal('size-modal');
    };

    function addToCart(productId, size) {
      const p = products.find(prod => prod.id === productId);
      const existing = cart.find(item => item.id === productId && item.size === size);

      if (existing) { existing.qty++; }
      else { cart.push({ id: productId, title: p.title, img: p.images[0], price: p.price, size: size, qty: 1 }); }
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      countEl.innerText = count;
      totalEl.innerText = `₹${total.toLocaleString()}`;
    }

    function openCart() {
      const itemsContainer = document.getElementById('cart-items');
      const totalModalEl = document.getElementById('cart-modal-total');
      itemsContainer.innerHTML = '';
      if(cart.length === 0) { itemsContainer.innerHTML = `<p style="text-align:center; padding: 20px; font-size:12px; color: var(--text-dim);">Bag empty. Add VAURA elegance.</p>`; }
      else {
        cart.forEach(item => {
          const div = document.createElement('div');
          div.className = 'cart-item';
          div.innerHTML = `
            <img src="${item.img}">
            <div class="cart-item-details">
              <div class="cart-item-title">${item.title}</div>
              <div class="cart-item-sub">Size: ${item.size} | Qty: ${item.qty} | ₹${(item.price*item.qty).toLocaleString()}</div>
            </div>
            <button class="btn-remove" onclick="removeFromCart('${item.id}', '${item.size}')">✕</button>
          `;
          itemsContainer.appendChild(div);
        });
      }
      totalModalEl.innerText = `₹${cart.reduce((sum, i) => sum + (i.price*i.qty), 0).toLocaleString()}`;
      openModal('cart-modal');
    }

    function removeFromCart(id, size) {
      cart = cart.filter(i => !(i.id === id && i.size === size));
      updateCartUI();
      openCart();
    }

    function checkoutWhatsApp() {
      if(cart.length === 0) { alert("Bag empty!"); return; }
      let text = `Hello THE VINAURA! 👑 I'd like to book:\n\n`;
      cart.forEach((i, idx) => text += `${idx+1}. ${i.title} (${i.size}) x${i.qty}\n`);
      const total = cart.reduce((sum, i) => sum + (i.price*i.qty), 0);
      text += `\nTotal Value: ₹${total.toLocaleString()}\nPlease share details.`;
      const url = `https://wa.me/${siteSettings.wa}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // --- --- ADMIN PANEL FX (Remember all settings, gallery upload) --- ---

    function loginAdmin() {
      const pin = document.getElementById('admin-pin').value;
      if (pin === '9999') { // SECRET PIN
        document.getElementById('admin-pin-container').style.display = 'none';
        document.getElementById('admin-main-container').style.display = 'block';
        loadAdminData();
      } else { alert("Access Denied."); document.getElementById('admin-pin').value = ''; }
    }

    function switchAdminTab(tabName) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`admin-${tabName}`).classList.add('active');
      if(tabName === 'inv') renderAdminInventory();
    }

    function loadAdminData() {
      document.getElementById('admin-wa-number').value = siteSettings.wa;
      document.getElementById('admin-ticker-input').value = siteSettings.ticker;
      // Previews
      formPromoImages = [...siteSettings.promoBanners]; // Queued from storage
      renderAdminPreviews(formPromoImages, 'promo-previews');
    }
    
    function renderAdminPreviews(imageArray, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      imageArray.forEach((b64, index) => {
        const box = document.createElement('div');
        box.className = 'preview-box';
        box.innerHTML = `<img src="${b64}"><button class="preview-remove" onclick="removeStoredImage('${containerId}', ${index})">✕</button>`;
        container.appendChild(box);
      });
    }
    
    function removeStoredImage(containerId, index) {
      // Logic trickier with storage vs queued. Simplified for single file input re-renders.
      if(containerId === 'promo-previews') formPromoImages.splice(index, 1);
      else formProdImages.splice(index, 1);
      renderAdminPreviews(containerId === 'promo-previews' ? formPromoImages : formProdImages, containerId);
    }

    function saveSiteSettings() {
      siteSettings.wa = document.getElementById('admin-wa-number').value.trim() || siteSettings.wa;
      siteSettings.ticker = document.getElementById('admin-ticker-input').value.trim() || siteSettings.ticker;
      siteSettings.promoBanners = [...formPromoImages]; // Use Base64 from queue
      dbSet('vinaura_settings', siteSettings);
      applySettings();
      renderPromos();
      closeModal('admin-modal');
      alert("VAURA Presence Updated ✨");
    }

    // Product Section
    function resetProdForm() {
      document.getElementById('edit-prod-id').value = '';
      document.getElementById('admin-product-form').reset();
      formProdImages = [];
      document.getElementById('prod-previews').innerHTML = '';
      document.getElementById('btn-save-prod').innerText = "Publish Product";
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    function saveProduct() {
      const id = document.getElementById('edit-prod-id').value || 'v'+Date.now();
      const title = document.getElementById('admin-prod-title').value.trim();
      const tag = document.getElementById('admin-prod-tag').value.trim();
      const price = parseFloat(document.getElementById('admin-prod-price').value);
      const oldPrice = parseFloat(document.getElementById('admin-prod-old-price').value);
      const sizesStr = document.getElementById('admin-prod-sizes').value;

      if(formProdImages.length === 0) { alert("VAURA needs visuals. Upload from gallery."); return; }
      if(!title || !price) { alert("Elegance needs details. Title & Price required."); return; }

      const sizes = sizesStr.split(',').map(s => s.trim()).filter(s => s.length > 0);

      const prodData = { id, images: [...formProdImages], title, tag, price, oldPrice: oldPrice || null, sizes };

      const existingIndex = products.findIndex(p => p.id === id);
      if (existingIndex > -1) { products[existingIndex] = prodData; alert("Vaura Collection Refined."); }
      else { products.unshift(prodData); alert("Vaura Collection Expanded."); } // Newest first

      dbSet('vinaura_products', products);
      renderProducts();
      switchAdminTab('inv');
      resetProdForm();
    }

    // Inventory List
    function renderAdminInventory() {
      const list = document.getElementById('admin-inventory-list');
      list.innerHTML = '';
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'inv-item';
        div.innerHTML = `
          <img src="${p.images[0]}" class="inv-img">
          <div style="flex:1;">
            <div style="font-size:12px; color:#fff;">${p.title}</div>
            <div style="font-size:11px; color:var(--gold-primary);">₹${p.price.toLocaleString()}</div>
          </div>
          <button class="btn-admin" onclick="startEditProd('${p.id}')">Refine</button>
          <button class="btn-admin del" onclick="deleteProd('${p.id}')">Remove</button>
        `;
        list.appendChild(div);
      });
    }

    function startEditProd(id) {
      const p = products.find(prod => prod.id === id);
      if(!p) return;
      switchAdminTab('add');
      document.getElementById('form-heading-title').innerText = "Refine Vaura Pice";
      document.getElementById('edit-prod-id').value = p.id;
      // Previews
      formProdImages = [...p.images];
      renderAdminPreviews(formProdImages, 'prod-previews');
      // Inputs
      document.getElementById('admin-prod-title').value = p.title;
      document.getElementById('admin-prod-tag').value = p.tag;
      document.getElementById('admin-prod-price').value = p.price;
      document.getElementById('admin-prod-old-price').value = p.oldPrice || '';
      document.getElementById('admin-prod-sizes').value = p.sizes.join(', ');
      
      document.getElementById('btn-save-prod').innerText = "Save Refinements";
      document.getElementById('btn-cancel-edit').style.display = 'block';
    }

    function deleteProd(id) {
      if(confirm("Vaura piece to be removed permanently?")) {
        products = products.filter(p => p.id !== id);
        dbSet('vinaura_products', products);
        renderProducts();
        renderAdminInventory();
      }
    }
  </script>
</body>
</html>
