<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Vinaura | Handcrafted Luxury Couture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #080808;
      --card-bg: #121212;
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
      --text-white: #FFFFFF;
      --text-dim: #A0A0A0;
      --border-gold: rgba(212, 175, 55, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 8, 8, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-logo {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
    }
    .tagline {
      font-size: 8px;
      color: var(--gold-light);
      letter-spacing: 2px;
      margin-top: 2px;
      text-transform: uppercase;
    }
    .nav-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .icon-btn {
      background: none;
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Montserrat', sans-serif;
    }

    /* PRODUCT CONTAINER */
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      margin-bottom: 35px;
      overflow: hidden;
    }

    /* MEDIA SCROLLER */
    .media-scroller-wrap {
      position: relative;
      background: #000;
    }
    .media-scroller {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      padding: 12px;
      scrollbar-width: none;
    }
    .media-scroller::-webkit-scrollbar { display: none; }
    .media-item {
      flex: 0 0 85%;
      max-width: 400px;
      height: 480px;
      scroll-snap-align: center;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.15);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-item img, .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* PRODUCT DETAILS */
    .product-content {
      padding: 24px 20px;
    }
    .product-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .product-price {
      font-size: 18px;
      font-weight: 600;
      color: var(--gold-primary);
      margin-bottom: 14px;
    }
    .product-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    /* SIZE SELECTOR */
    .size-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 8px;
      display: block;
    }
    .size-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .size-btn {
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn.active {
      background: var(--gold-primary);
      color: #000;
      font-weight: 600;
      border-color: var(--gold-primary);
    }

    /* ACTION BUTTONS */
    .card-actions {
      display: flex;
      gap: 12px;
    }
    .btn-add-cart {
      flex: 1;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-order-wa {
      flex: 1.2;
      padding: 14px;
      background: var(--gold-gradient);
      border: none;
      color: #000;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* FLOATING CART */
    .cart-drawer-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--gold-gradient);
      color: #000;
      padding: 14px 22px;
      border-radius: 30px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      cursor: pointer;
      z-index: 99;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* MODALS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 22px;
      cursor: pointer;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: var(--gold-light);
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-gold);
      padding-bottom: 12px;
    }

    /* FORMS */
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--gold-primary);
    }
    .form-group small {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* CART ITEMS */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .cart-item-title { font-size: 14px; color: #fff; font-weight: 500; }
    .cart-item-sub { font-size: 12px; color: var(--gold-primary); }
    .cart-remove-btn { background: none; border: none; color: #ff5c5c; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <div class="brand-logo">THE VINAURA</div>
      <div class="tagline">Bespoke Handcrafted Couture</div>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openAdminModal()">⚙️ Admin Panel</button>
    </div>
  </header>

  <!-- PRODUCTS FEED -->
  <main class="container" id="products-list"></main>

  <!-- FLOATING CART BUTTON -->
  <button class="cart-drawer-toggle" onclick="openCartModal()">
    🛒 View Bag (<span id="cart-count">0</span>)
  </button>

  <!-- CART MODAL -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeCartModal()">✕</button>
      <div class="modal-title">Your Shopping Bag</div>
      <div id="cart-items-container"></div>
      <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; color: var(--text-dim);">Total Estimated:</span>
        <span id="cart-total-price" style="font-size: 18px; color: var(--gold-primary); font-weight: 700;">₹0</span>
      </div>
      <button class="btn-order-wa" style="width: 100%; margin-top: 18px;" onclick="checkoutCartViaWhatsApp()">
        Order Entire Bag via WhatsApp 💬
      </button>
    </div>
  </div>

  <!-- ADMIN MANAGEMENT MODAL -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAdminModal()">✕</button>
      <div class="modal-title">Admin Management Panel</div>
      
      <!-- WHATSAPP NUMBER SETTING -->
      <div style="background: #1a1a1a; padding: 14px; border-radius: 8px; border: 1px solid var(--border-gold); margin-bottom: 20px;">
        <div class="form-group" style="margin-bottom: 8px;">
          <label>Store WhatsApp Number (with Country Code)</label>
          <input type="text" id="admin-whatsapp-input" placeholder="e.g. 918143714524">
        </div>
        <button class="icon-btn" style="width: 100%; justify-content: center; background: var(--gold-primary); color: #000; font-weight: 600;" onclick="saveWhatsAppNumber()">Update WhatsApp Number</button>
      </div>

      <hr style="border: 0; border-top: 1px solid #222; margin: 20px 0;">
      
      <h4 style="font-family: 'Cinzel', serif; color: var(--gold-light); margin-bottom: 12px; font-size: 14px;" id="form-heading-title">Add / Edit Product</h4>
      <form id="admin-product-form" onsubmit="handleProductSave(event)">
        <input type="hidden" id="edit-product-id" value="">
        <div class="form-group">
          <label>Product Title</label>
          <input type="text" id="prod-title" placeholder="e.g. Royal Rani Pink Pattu Pavada Set" required>
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="prod-price" placeholder="e.g. 2499" required>
        </div>
        <div class="form-group">
          <label>Image URLs (Up to 7-8 images, comma separated)</label>
          <textarea id="prod-images" rows="3" placeholder="https://image1.jpg, https://image2.jpg" required></textarea>
        </div>
        <div class="form-group">
          <label>Video URL (Optional .mp4 direct link)</label>
          <input type="text" id="prod-video" placeholder="https://example.com/video.mp4">
        </div>
        <div class="form-group">
          <label>Available Sizes (comma separated)</label>
          <input type="text" id="prod-sizes" value="0-6 Months, 6-12 Months, 1-2 Years, 2-4 Years, 4-6 Years" required>
        </div>
        <div class="form-group">
          <label>Description & Crafting Highlights</label>
          <textarea id="prod-desc" rows="4" placeholder="Mention fabric, zari, lining comfort..."></textarea>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn-order-wa" style="flex: 2;">Save Product</button>
          <button type="button" class="icon-btn" style="flex: 1; justify-content: center;" onclick="resetAdminForm()">Cancel</button>
        </div>
      </form>

      <hr style="border: 0; border-top: 1px solid #222; margin: 24px 0;">
      <h4 style="font-family: 'Cinzel', serif; color: var(--gold-light); margin-bottom: 12px; font-size: 14px;">Existing Products Inventory</h4>
      <div id="admin-inventory-list"></div>
    </div>
  </div>

  <script>
    // INITIAL CONFIG & DATA
    let storeWhatsApp = localStorage.getItem('vinaura_whatsapp') || "918143714524";
    
    const DEFAULT_PRODUCTS = [
      {
        id: "vinaura-01",
        title: "Signature Heritage Rani Pink & Ivory Pattu Pavada",
        price: 2699,
        images: [
          "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=800&q=80"
        ],
        video: "",
        sizes: ["0-6 Months", "6-12 Months", "1-2 Years", "2-4 Years", "4-6 Years"],
        desc: "• Fabric: Pure Silk Jacquard with Traditional Zarī Weave\n• Comfort: 100% Breathable Pure Cotton Inner Lining (Skin Friendly)\n• Details: Scalloped Gold Embroidery & Handmade Latkans\n• Perfect for Festivals, Weddings & Cradle Ceremonies"
      }
    ];

    let products = JSON.parse(localStorage.getItem('vinaura_products')) || DEFAULT_PRODUCTS;
    let cart = JSON.parse(localStorage.getItem('vinaura_cart')) || [];
    let selectedSizes = {};

    function saveData() {
      localStorage.setItem('vinaura_products', JSON.stringify(products));
    }
    function saveCart() {
      localStorage.setItem('vinaura_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function saveWhatsAppNumber() {
      const numInput = document.getElementById('admin-whatsapp-input').value.trim();
      if (!numInput) {
        alert("Please enter a valid WhatsApp number!");
        return;
      }
      storeWhatsApp = numInput;
      localStorage.setItem('vinaura_whatsapp', storeWhatsApp);
      alert("WhatsApp number updated successfully!");
    }

    // RENDER PRODUCTS
    function renderProducts() {
      const container = document.getElementById('products-list');
      container.innerHTML = '';

      products.forEach(p => {
        if (!selectedSizes[p.id] && p.sizes.length > 0) {
          selectedSizes[p.id] = p.sizes[0];
        }

        let mediaHtml = '';
        p.images.forEach(imgUrl => {
          if (imgUrl.trim()) {
            mediaHtml += `<div class="media-item"><img src="${imgUrl.trim()}" alt="${p.title}" loading="lazy"></div>`;
          }
        });
        if (p.video && p.video.trim()) {
          mediaHtml += `<div class="media-item"><video src="${p.video.trim()}" controls playsinline muted></video></div>`;
        }

        let sizesHtml = p.sizes.map(s => `
          <button class="size-btn ${selectedSizes[p.id] === s.trim() ? 'active' : ''}" 
                  onclick="selectSize('${p.id}', '${s.trim()}')">${s.trim()}</button>
        `).join('');

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="media-scroller-wrap">
            <div class="media-scroller">
              ${mediaHtml}
            </div>
          </div>
          <div class="product-content">
            <h2 class="product-title">${p.title}</h2>
            <div class="product-price">₹${p.price.toLocaleString()}</div>
            <div class="product-desc">${p.desc}</div>
            
            <span class="size-label">Select Size</span>
            <div class="size-options">${sizesHtml}</div>

            <div class="card-actions">
              <button class="btn-add-cart" onclick="addToCart('${p.id}')">Add To Bag</button>
              <button class="btn-order-wa" onclick="orderDirectWhatsApp('${p.id}')">Order on WhatsApp 💬</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectSize(productId, size) {
      selectedSizes[productId] = size;
      renderProducts();
    }

    // DIRECT ORDER VIA WHATSAPP
    function orderDirectWhatsApp(productId) {
      const prod = products.find(p => p.id === productId);
      const chosenSize = selectedSizes[productId] || "Standard";
      
      const message = `Hello The Vinaura! 👑\n\nI want to place an order:\n*Product:* ${prod.title}\n*Price:* ₹${prod.price}\n*Selected Size:* ${chosenSize}\n*Reference Image:* ${prod.images[0] || 'N/A'}\n\nPlease confirm availability and details.`;
      
      const waUrl = `https://wa.me/${storeWhatsApp}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }

    // CART OPERATIONS
    function addToCart(productId) {
      const prod = products.find(p => p.id === productId);
      const chosenSize = selectedSizes[productId] || prod.sizes[0] || "Custom";

      cart.push({
        cartItemId: Date.now().toString(),
        productId: prod.id,
        title: prod.title,
        price: prod.price,
        size: chosenSize,
        image: prod.images[0] || ''
      });
      saveCart();
      alert(`"${prod.title}" (Size: ${chosenSize}) added to your bag!`);
    }

    function removeFromCart(cartItemId) {
      cart = cart.filter(item => item.cartItemId !== cartItemId);
      saveCart();
      renderCartItems();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById('cart-modal').style.display = 'flex';
    }
    function closeCartModal() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total-price');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-dim); padding: 20px;">Your shopping bag is empty.</p>`;
        totalEl.innerText = "₹0";
        return;
      }

      let total = 0;
      cart.forEach(item => {
        total += Number(item.price);
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
          <div>
            <div class="cart-item-title">${item.title}</div>
            <div class="cart-item-sub">Size: ${item.size} | ₹${item.price}</div>
          </div>
          <button class="cart-remove-btn" onclick="removeFromCart('${item.cartItemId}')">Remove</button>
        `;
        container.appendChild(el);
      });
      totalEl.innerText = `₹${total.toLocaleString()}`;
    }

    function checkoutCartViaWhatsApp() {
      if (cart.length === 0) {
        alert("Your bag is empty!");
        return;
      }

      let text = `Hello The Vinaura! 👑\nI would like to place an order for items in my bag:\n\n`;
      let grandTotal = 0;

      cart.forEach((item, index) => {
        grandTotal += Number(item.price);
        text += `${index + 1}. *${item.title}*\n   Size: ${item.size}\n   Price: ₹${item.price}\n\n`;
      });

      text += `*Total Order Value:* ₹${grandTotal.toLocaleString()}\n\nPlease confirm availability.`;
      
      const waUrl = `https://wa.me/${storeWhatsApp}?text=${encodeURIComponent(text)}`;
      window.open(waUrl, '_blank');
    }

    // ADMIN MANAGEMENT
    function openAdminModal() {
      document.getElementById('admin-whatsapp-input').value = storeWhatsApp;
      renderAdminInventory();
      document.getElementById('admin-modal').style.display = 'flex';
    }
    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
      resetAdminForm();
    }

    function resetAdminForm() {
      document.getElementById('admin-product-form').reset();
      document.getElementById('edit-product-id').value = "";
      document.getElementById('form-heading-title').innerText = "Add New Product";
    }

    function handleProductSave(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-product-id').value;
      const title = document.getElementById('prod-title').value.trim();
      const price = Number(document.getElementById('prod-price').value);
      const imagesStr = document.getElementById('prod-images').value;
      const video = document.getElementById('prod-video').value.trim();
      const sizesStr = document.getElementById('prod-sizes').value;
      const desc = document.getElementById('prod-desc').value.trim();

      const images = imagesStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
      const sizes = sizesStr.split(',').map(s => s.trim()).filter(s => s.length > 0);

      if (editId) {
        const index = products.findIndex(p => p.id === editId);
        if (index !== -1) {
          products[index] = { ...products[index], title, price, images, video, sizes, desc };
        }
      } else {
        const newProduct = {
          id: "vinaura-" + Date.now(),
          title,
          price,
          images,
          video,
          sizes,
          desc
        };
        products.push(newProduct);
      }

      saveData();
      renderProducts();
      renderAdminInventory();
      resetAdminForm();
      alert("Product saved successfully!");
    }

    function editProduct(productId) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;

      document.getElementById('edit-product-id').value = prod.id;
      document.getElementById('prod-title').value = prod.title;
      document.getElementById('prod-price').value = prod.price;
      document.getElementById('prod-images').value = prod.images.join(', ');
      document.getElementById('prod-video').value = prod.video || '';
      document.getElementById('prod-sizes').value = prod.sizes.join(', ');
      document.getElementById('prod-desc').value = prod.desc;
      document.getElementById('form-heading-title').innerText = "Edit Product: " + prod.title;
      
      document.querySelector('.modal-content').scrollTop = 0;
    }

    function deleteProduct(productId) {
      if (confirm("Are you sure you want to delete this product?")) {
        products = products.filter(p => p.id !== productId);
        saveData();
        renderProducts();
        renderAdminInventory();
      }
    }

    function renderAdminInventory() {
      const list = document.getElementById('admin-inventory-list');
      list.innerHTML = '';

      if (products.length === 0) {
        list.innerHTML = `<p style="font-size: 12px; color: var(--text-dim);">No products found.</p>`;
        return;
      }

      products.forEach(p => {
        const item = document.createElement('div');
        item.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222;";
        item.innerHTML = `
          <div>
            <div style="font-size: 13px; color: #fff;">${p.title}</div>
            <div style="font-size: 11px; color: var(--gold-primary);">₹${p.price}</div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button onclick="editProduct('${p.id}')" style="background: none; border: 1px solid var(--gold-primary); color: var(--gold-primary); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">Edit</button>
            <button onclick="deleteProduct('${p.id}')" style="background: none; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">Delete</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    // INIT
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
